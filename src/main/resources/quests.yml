# ---------------------------------------------------------------------------------------------
# Ascension - rank quests
#
# One combined quest per rank stage (key = stage id from ranks.yml). A player must open their
# Chronicle, view the quest and press "Accept Quest". Only progress made AFTER accepting counts.
# When every objective is complete the player advances automatically.
#
# Objective keys (xp, hostiles, ...) are the progress ids. Renaming a key while players have that
# quest active resets their progress on that objective.
#
# Objective types:
#   gain-levels         cumulative experience levels earned after accepting the quest.
#                       Spending or losing levels never subtracts progress; re-earned levels count.
#   kill-mobs           targets: entity types and/or categories: [hostile, nether, illager]
#   kill-distinct-mobs  amount = number of DIFFERENT mob types (from targets/categories)
#   mine-blocks         natural blocks only (player-placed and lava/water-formed blocks don't count)
#   smelt-items         items taken out of a furnace, smoker or blast furnace
#   obtain-items        from natural sources only: mining drops, your own mob kills, loot chests,
#                       fishing and smelting. Picking up dropped/traded items never counts.
#   submit-items        handed in with the "Submit Item" button; the server verifies and removes them
#   player-kills        valid PvP kills (see config.yml pvp rules); "unique" = minimum unique victims
#   hunts               assigned-player hunts
#   raids               raids won
#   defeat-boss         targets: [WARDEN|WITHER|ELDER_GUARDIAN|RAVAGER]; final-hit / summoned optional
#
# No quest may require killing the Ender Dragon. Dragon Heads from End Ships are allowed.
# ---------------------------------------------------------------------------------------------

bronze_1:
  objectives:
    xp:       { type: gain-levels, amount: 30, description: "Gain 30 experience levels" }
    hostiles: { type: kill-mobs, categories: [hostile], amount: 10, description: "Kill 10 hostile mobs" }
