      settings: { radius: 8.0, combat-damage-health-points: 8.0, illager-damage-health-points: 12.0, knockback: 1.2, raid-strength-seconds: 8.0 }
    auto-award: false

  - id: tideborn
    number: 17
    name: Tideborn
    color: "#26a6a1"
    description: "A champion of ocean monuments and conduit power."
    requirements:
      - type: stat
        keys: [bosses.ELDER_GUARDIAN]
        amount: 1
        label: "Defeat an Elder Guardian"
      - type: stat
        keys: [conduits.activated]
        amount: 1
        label: "Activate a Conduit"
    ability:
      name: Tidal Rush
      description: "Right-click the Ascension Relic to rush underwater and restore oxygen, or dash at half strength on land."
      cooldown-seconds: 30
      settings: { horizontal-force: 1.8, land-force-multiplier: 0.5, vertical-force: 0.25 }
    auto-award: false

  - id: beastbane
    number: 18
    name: Beastbane
    color: "#c0392b"
    description: "A veteran slayer of hostile mobs."
    requirements:
      - type: stat
        keys: [kills.hostile]
        amount: 1000
        label: "Kill 1,000 hostile mobs"
    ability:
      name: Executioner
      description: "Automatically strike a hostile mob or eligible player at 8 effective HP or less for 14 damage."
      cooldown-seconds: 15
      settings: { health-threshold-health-points: 8.0, execute-damage-health-points: 14.0 }
    auto-award: false

  - id: emberforge
    number: 19
    name: Emberforge
    color: "#e67e22"
    description: "A smith whose strikes burn like molten metal."
    requirements:
      - type: stat
        keys: [anvil.operations]
        amount: 100
        label: "Repair or combine 100 items"
      - type: stat
        keys: [kills.nether]
        amount: 100
        label: "Kill 100 Nether mobs"
    ability:
      name: Molten Edge
      description: "Right-click the Ascension Relic for 8 seconds of +5 attack damage and Fire Aspect II."
      cooldown-seconds: 60
      settings: { duration-seconds: 8.0, bonus-damage-health-points: 5.0, fire-seconds: 8.0 }
    auto-award: false

  - id: alchemist
    number: 20
    name: Alchemist
    color: "#8e44ad"
    description: "A brewer of a hundred potions."
    requirements:
      - type: stat
        keys: [potions.brewed]
        amount: 100
        label: "Brew 100 potions"
    ability:
      name: Catalyst
      description: "Thrown potions last longer and splash across a wider area without duplicating effects."
      cooldown-seconds: 10
      settings: { duration-multiplier: 1.25, splash-radius: 5.0 }
    auto-award: false

  - id: treasure_whisperer
    number: 21
    name: Treasure Whisperer
    color: "#f1c40f"
    description: "A finder of naturally generated treasures."
    requirements:
      - type: stat
        keys: [loot.structure_containers]
        amount: 30
        label: "Open 30 naturally generated loot containers"
    ability:
      name: Treasure Pulse
      description: "Right-click the Ascension Relic to highlight nearby treasure; eligible natural containers may grant one bonus treasure roll."
      cooldown-seconds: 60
      settings: { range: 16.0, bonus-chance: 0.05 }
    auto-award: false

  - id: berserker
    number: 22
    name: Berserker
    color: "#e74c3c"
    description: "A fighter whose recent wounds fuel stronger attacks."
    requirements:
      - type: stat
        keys: [pvp.kills]
        amount: 25
        label: "Complete 25 valid player kills"
    ability:
      name: Rage
      description: "Automatically gain up to 6 bonus damage from health recently lost; rage fades over 10 seconds."
      cooldown-seconds: 0
      settings: { decay-seconds: 10.0, health-lost-per-bonus-damage: 2.0, maximum-bonus-damage: 6.0 }
    auto-award: false

  - id: colossus
    number: 23
    name: Colossus
    color: "#95a5a6"
    description: "An immovable defender with two additional hearts."
    requirements:
      - type: stat
        keys: [raids]
        amount: 3
        label: "Complete 3 raids"
    ability:
      name: Giant Heart
      description: "While equipped, permanently gain two extra maximum hearts. No stick required."
      cooldown-seconds: 0
      settings: { bonus-max-health-points: 4.0 }
    auto-award: false

  - id: ashborn
    number: 24
    name: Ashborn
    color: "#d35400"
    description: "A survivor of a hundred Nether battles."
    requirements:
      - type: stat
        keys: [kills.nether]
        amount: 100
        label: "Kill 100 Nether mobs"
    ability:
      name: Flame Purge
      description: "Right-click the Ascension Relic to extinguish yourself, damage nearby enemies and ignite them for 4 seconds."
      cooldown-seconds: 45
      settings: { radius: 5.0, combat-damage-health-points: 8.0, burn-seconds: 4.0 }
    auto-award: false

  - id: trailblazer
    number: 25
    name: Trailblazer
    color: "#27ae60"
    description: "A traveler who has crossed a great distance."
    requirements:
      - type: stat
        keys: [travel.blocks]
        amount: 25000
        label: "Travel 25,000 blocks"
    ability:
      name: Dash
      description: "Right-click the Ascension Relic to dash safely forward."
      cooldown-seconds: 25
      settings: { horizontal-force: 1.6, vertical-force: 0.25 }
    auto-award: false

  - id: angler
    number: 26
    name: Angler
    color: "#3498db"
    description: "A patient fisher with a hundred catches."
    requirements:
      - type: stat
        keys: [fish.caught]
        amount: 100
        label: "Catch 100 fish"
    ability:
      name: Deep Lure
      description: "Right-click the Ascension Relic, then fish within 30 seconds for a shorter wait and guaranteed treasure catch."
      cooldown-seconds: 20
      settings: { wait-ticks: 60.0 }
    auto-award: false

  - id: mycelial_drifter
    number: 27
    name: Mycelial Drifter
    color: "#9c6eaf"
    description: "A cultivator who commands a restorative spore cloud."
    requirements:
      - type: stat
        keys: [crops.harvested]
        amount: 500
        label: "Harvest 500 mature crops"
      - type: stat
        keys: [kills.hostile]
        amount: 100
        label: "Kill 100 hostile mobs"
    ability:
      name: Spore Cloud
      description: "Right-click the Ascension Relic to create a four-second damaging cloud that heals you once."
      cooldown-seconds: 45
      settings: { radius: 4.0, ticks: 4.0, damage-per-tick-health-points: 2.0, heal-health-points: 2.0 }
