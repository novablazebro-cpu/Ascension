        amount: 10
        label: "Loot 10 Ancient City containers"
      - type: stat
        keys: [kills.hostile]
        amount: 250
        label: "Kill 250 hostile mobs"
    ability:
      name: Frost Nova
      description: "Right-click the Ascension Relic to deal 6 damage and apply Slowness II to nearby enemies."
