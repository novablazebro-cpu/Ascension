  - id: soul_reaper
    number: 14
    name: Soul Reaper
    color: "#704f8f"
    description: "A relentless reaper of mobs and players."
    requirements:
      - type: stat
        keys: [kills.hostile]
        amount: 1500
        label: "Kill 1,500 hostile mobs"
      - type: stat
        keys: [pvp.kills]
        amount: 50
        label: "Complete 50 valid player kills"
    ability:
      name: Soul Storage
      description: "Valid kills store souls; right-click the Ascension Relic to consume one and heal."
      cooldown-seconds: 20
      settings: { maximum-souls: 10.0, heal-health-points: 4.0 }
    auto-award: false

  - id: bounty_hunter
    number: 15
    name: Bounty Hunter
    color: "#d99a2b"
    description: "A proven tracker of assigned targets."
