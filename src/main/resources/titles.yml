# ---------------------------------------------------------------------------------------------
# Ascension - globally exclusive titles
#
# Titles are ordered from hardest (#1) to easiest (#30). A player may own at most five titles,
# and ownership is never released merely because the owner is offline.
#
# Requirement types:
#   stat:    keys (lifetime stat keys), amount, label
#   rank:    rank-index (0-based ladder index), mastery, label
#   possess: material, optional enchantment, label (checked at claim time)
#   streak:  days, label (best deathless streak)
#
# Eligibility counters are produced by validated server events. End City progress is deduplicated
# by generated-structure identity rather than by chest count.
# ---------------------------------------------------------------------------------------------

ownership-limit: 5
inactivity-release:
  enabled: false

titles:
  - id: ascendant
    number: 1
    name: Ascendant
    color: "#f5d76e"
    description: "The summit of rank, combat, hunting, bosses, and endurance."
    requirements:
      - type: rank
        rank-index: 11
        mastery: true
        label: "Complete Platinum mastery"
      - type: stat
        keys: [hunts]
        amount: 100
        label: "Complete 100 assigned hunts"
      - type: stat
        keys: [pvp.kills]
        amount: 500
        label: "Complete 500 valid player kills"
      - type: stat
        keys: [bosses.WARDEN, bosses.WITHER, bosses.ELDER_GUARDIAN]
        amount: 6
        label: "Defeat multiple Wardens, Withers, and Elder Guardians"
      - type: streak
        days: 50
        label: "Reach a 50-day deathless streak"
    ability:
      name: Ascension
      description: "Right-click the Ascension Relic for Strength V, Speed III and Resistance IV for 30 seconds."
      cooldown-seconds: 300
      settings: { buff-duration-seconds: 30.0, strength-level: 5.0, speed-level: 3.0, resistance-level: 4.0 }
    auto-award: false

  - id: conqueror
    number: 2
    name: Conqueror
    color: "#d9485f"
    description: "A master of the final rank and assigned hunts."
    requirements:
      - type: rank
        rank-index: 11
        mastery: true
        label: "Complete Platinum mastery"
      - type: stat
        keys: [hunts]
        amount: 50
        label: "Complete 50 assigned hunts"
    ability:
      name: War Cry
      description: "Right-click the Ascension Relic to gain Strength and give nearby players and hostile mobs Weakness II and Slowness IV."
      cooldown-seconds: 60
      settings: { radius: 10.0, duration-seconds: 8.0, weakness-level: 2.0, slowness-level: 4.0 }
    auto-award: false

  - id: stormbringer
    number: 3
    name: Thunder God
    color: "#7aa7ff"
    description: "A Platinum master who commands the storm."
    requirements:
      - type: rank
        rank-index: 11
        mastery: true
        label: "Complete Platinum III and mastery"
      - type: stat
        keys: [bosses.WARDEN]
        amount: 1
        label: "Defeat a Warden"
      - type: stat
        keys: [submitted.DRAGON_HEAD]
        amount: 1
        label: "Submit a Dragon Head"
      - type: stat
        keys: [pvp.kills]
        amount: 100
        label: "Complete 100 valid player kills"
    ability:
      name: Heaven's Judgment
      description: "Right-click the Ascension Relic to strike the closest eligible player within 50 blocks for 13 hearts of raw damage. Armor and protection still apply."
      cooldown-seconds: 35
      settings: { player-damage-health-points: 26.0 }
    auto-award: false

  - id: tempest_herald
    number: 4
    name: Tempest Herald
    color: "#6ec6ff"
    description: "A storm hunter armed with a channeling trident."
    requirements:
      - type: possess
        material: TRIDENT
        enchantment: channeling
        label: "Possess a Channeling Trident"
      - type: stat
        keys: [pvp.storm_kills]
        amount: 25
        label: "Complete 25 storm kills"
    ability:
      name: Chain Lightning
      description: "Look at a target and right-click the Ascension Relic to chain lightning."
      cooldown-seconds: 45
      settings: { range: 20.0, chain-range: 8.0, combat-damage-health-points: 8.0, chain-multiplier: 1.0 }
    auto-award: false

  - id: voidwalker
    number: 5
    name: Voidwalker
    color: "#8d74d6"
    description: "A traveler who has conquered the End."
    requirements:
      - type: stat
        keys: [loot.end_cities]
        amount: 5
        label: "Loot five End City containers"
    ability:
      name: Void Step
      description: "Point at a safe landing spot and right-click the Ascension Relic to teleport. Three charges; each returns after 60 seconds."
      cooldown-seconds: 60
      settings: { aim-range: 32.0, charge-recharge-seconds: 60.0 }
    auto-award: false

  - id: bloodlord
    number: 6
    name: Bloodlord
    color: "#b52b3b"
    description: "A feared champion of player combat."
    requirements:
      - type: stat
        keys: [pvp.kills]
        amount: 200
        label: "Complete 200 valid player kills"
    ability:
      name: Vampire
      description: "Every damaging hit against a mob or eligible PvP player heals 20% of final damage, up to 3 HP per hit. No relic or cooldown required."
      cooldown-seconds: 0
      settings: { lifesteal-ratio: 0.2 }
    auto-award: false

  - id: chronomancer
    number: 7
    name: Chronomancer
    color: "#9aa7c7"
    description: "A survivor who can undo a moment in combat."
    requirements:
      - type: stat
        keys: [pvp.nighttime_kills]
        amount: 100
        label: "Complete 100 valid nighttime player kills"
    ability:
      name: Rewind
      description: "Right-click the Ascension Relic to save your position and health, then click again within 3 seconds to rewind."
      cooldown-seconds: 120
      settings: { window-seconds: 3.0 }
    auto-award: false

  - id: titan
    number: 8
    name: Titan
    color: "#c58b52"
    description: "A Platinum warrior who has faced the strongest bosses."
    requirements:
      - type: rank
        rank-index: 11
        mastery: false
        label: "Reach Platinum"
      - type: stat
        keys: [bosses.WARDEN]
        amount: 2
        label: "Defeat multiple Wardens"
      - type: stat
        keys: [bosses.WITHER]
        amount: 2
        label: "Defeat multiple Withers"
    ability:
      name: Ground Slam
      description: "Right-click the Ascension Relic to slam eligible targets within 3 blocks for 13 hearts of raw damage and knockback. Armor and protection still apply."
      cooldown-seconds: 30
      settings: { radius: 3.0, combat-damage-health-points: 26.0, knockback: 1.4 }
    auto-award: false

  - id: undying
    number: 9
    name: Undying
    color: "#f2c94c"
    description: "The first player to maintain a 25-day deathless streak."
    requirements:
      - type: streak
        days: 25
        label: "Be the first player to complete a 25-day deathless streak"
    ability:
      name: Refuse Death
      description: "Survive one otherwise fatal attack, with a 24-hour cooldown."
      cooldown-seconds: 86400
    auto-award: true

  - id: end_city_conqueror
    number: 10
    name: End City Conqueror
    color: "#d7b8ff"
    description: "A looter of the End's rarest treasures."
    requirements:
      - type: stat
        keys: [loot.end_city.ELYTRA]
        amount: 1
        label: "Obtain an Elytra from an End structure"
      - type: stat
        keys: [loot.end_city.DRAGON_HEAD]
        amount: 1
        label: "Obtain a Dragon Head from an End structure"
    ability:
      name: Sky Rescue
      description: "Prevent dangerous fall damage, gain Slow Falling, then Speed II for 2 seconds on landing."
      cooldown-seconds: 45
      settings: { minimum-fall-distance: 6.0, slow-falling-seconds: 5.0, landing-speed-seconds: 2.0 }
    auto-award: false

  - id: wardens_bane
    number: 11
    name: Warden's Bane
    color: "#34495e"
    description: "A hunter who survives the deep dark and earns the final blow."
    requirements:
      - type: stat
        keys: [bosses.WARDEN]
        amount: 1
        label: "Kill a Warden after dealing at least 25% of its health"
    ability:
      name: Sonic Ward
      description: "Greatly reduce a sonic boom or halve one incoming hit of at least 8 hearts."
      cooldown-seconds: 60
      settings: { damage-multiplier: 0.2, heavy-hit-threshold-health-points: 16.0, heavy-hit-multiplier: 0.5 }
    auto-award: false

  - id: frostbound
    number: 12
    name: Frostbound
    color: "#8ad8ff"
    description: "A hunter who freezes enemies in place."
    requirements:
