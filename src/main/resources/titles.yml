    color: "#795548"
    description: "A practiced hunter of hostile mobs."
    requirements:
      - type: stat
        keys: [kills.hostile]
        amount: 250
        label: "Kill 250 hostile mobs"
    ability:
      name: Marked Prey
      description: "The first attacked hostile mob or eligible player is marked and takes increased owner damage for 8 seconds."
      cooldown-seconds: 20
      settings: { duration-seconds: 8.0, combat-damage-multiplier: 1.5 }
    auto-award: false

  - id: stonebreaker
    number: 29
    name: Stonebreaker
    color: "#7f8c8d"
    description: "A miner who has broken five hundred stone blocks."
    requirements:
      - type: stat
        keys: [mined.STONE, mined.DEEPSLATE]
        amount: 500
        label: "Mine 500 stone or deepslate"
    ability:
      name: Shatter
      description: "Periodically break a small connected stone cluster; some extra drops are automatically smelted."
      cooldown-seconds: 30
      settings: { maximum-extra-blocks: 5.0, auto-smelt-chance: 0.1 }
    auto-award: false

  - id: new_arrival
    number: 30
    name: New Arrival
    color: "#ecf0f1"
    description: "A new adventurer taking the first steps toward Ascension."
    requirements:
      - type: stat
        keys: [levels]
        amount: 30
        label: "Gain 30 experience levels"
    ability:
      name: Second Wind
      description: "Killing a hostile mob restores one heart and briefly grants Speed I."
      cooldown-seconds: 12
      settings: { restorative-heal-health-points: 2.0, speed-seconds: 2.0 }
    auto-award: false
